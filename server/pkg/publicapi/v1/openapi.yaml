openapi: 3.1.0
info:
  title: Multica Public API
  version: v1
  description: >-
    Canonical v1 resource contract shared by Multica API surfaces. The Plugin
    API applies installation identity plus manifest scopes. The member
    surface is mounted at /api/v1 and currently accepts workspace-bound scoped
    member PATs. Scoped PATs are rejected on legacy /api and realtime surfaces;
    unscoped legacy PATs remain available there. Use Plugin credentials only
    with the Plugin server and member PATs only with the member server.
    Plugin-specific context and storage remain extensions.
servers:
  - url: https://plugin-api.multica.ai/v1
    description: Installed Plugin and invocation callback tokens
security:
  - pluginBearer: []
paths:
  /delegations:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    get:
      operationId: listPublicDelegations
      summary: Reconcile the current member's delegations
      description: >-
        Disabled unless public_delegations_v1 is enabled (default OFF).
        Workspace/member-scoped even for admins, including lookups by the original
        idempotency key after response loss or PAT rotation. Does not create tasks.
        Unknown or inaccessible matches yield an empty list. UUID-ordered keyset
        pagination bounds database results and responses; cursors are bound to the
        actor, workspace and filters and do not grant access.
      x-multica-contract: shared_resource
      x-multica-scope: delegations:read
      x-multica-workspace-roles: [member, admin, owner]
      x-multica-audit: planned
      x-multica-rate-limit-profiles: [user_default]
      security:
        - memberPAT: []
      servers:
        - url: https://api.multica.ai/api/v1
      parameters:
        - name: idempotency_key
          in: query
          description: Exact original key, scoped to the current member
          schema: { type: string, minLength: 1, maxLength: 255 }
        - name: delegation_id
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: Bounded caller-owned matches, with optional continuation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegationListResponse"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createPublicDelegation
      summary: Admit one confirmed delegation to the durable task queue
      description: >-
        Member PAT only, with delegations:write. Disabled unless the server flag
        public_delegations_v1 is enabled (default OFF). The caller must obtain
        human confirmation before submission. Creates no issue or assignment.
        The runtime must be ready and advertise public-delegation-v1.
        Idempotency is scoped to workspace and member, across PAT rotation.
        The hash covers the decoded request, with UUIDs canonicalized; JSON key
        order/whitespace is ignored, all string content is preserved. Unknown
        fields are rejected. String size limits are measured in UTF-8 bytes;
        the complete JSON body is limited to 512 KiB. Same key/payload returns the original IDs and
        current task status, even if the target subsequently changes. A changed
        payload conflicts. If execution history was deleted, the original IDs are
        returned with status unavailable; a retry never recreates the execution.
        A new request compares expected_runtime_id under a
        lock and rejects rebinding. Missing, mismatched, or disallowed runtime
        bindings uniformly return runtime_binding_changed. Permission changes
        are serialized with admission; delivery rechecks membership and invocation
        rights in the transaction that mints task credentials. Validation
        failures roll back both records.
        Acceptance means queued; no execution slot is reserved. The scheduler
        enforces capacity. Retry ambiguous responses with the same key/payload.
        Keys are retained until workspace deletion and must not be reused.
      x-multica-contract: shared_resource
      x-multica-scope: delegations:write
      x-multica-workspace-roles: [member, admin, owner]
      x-multica-audit: planned
      x-multica-rate-limit-profiles: [user_default]
      security:
        - memberPAT: []
      servers:
        - url: https://api.multica.ai/api/v1
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDelegationRequest"
      responses:
        "202":
          description: Atomically accepted and queued; capacity is scheduler-enforced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delegation"
        "200":
          description: Idempotent replay with original IDs and current task status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delegation"
        "409":
          description: idempotency_conflict, runtime_binding_changed, target_unavailable, or runtime_unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /delegations/{delegation_id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - name: delegation_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getPublicDelegation
      summary: Read a delegation's compact execution status
      description: >-
        Disabled unless public_delegations_v1 is enabled (default OFF). Current
        workspace membership and requester identity or owner/admin role are required.
        Missing, foreign and unauthorized delegations uniformly return not_found.
        No profile/runtime configuration, result text, error text or execution
        internals are returned. Invocation revocation does not remove the requester's
        right to reconcile already accepted work. Membership revocation does.
        Status is authoritative at the read snapshot. Revisions are opaque content
        hashes, not sequence numbers; clients must ignore observations that would
        regress an observed terminal state. Missing execution history is unavailable,
        not a confirmed terminal execution outcome, and never recreates a task.
      x-multica-contract: shared_resource
      x-multica-scope: delegations:read
      x-multica-workspace-roles: [member, admin, owner]
      x-multica-audit: planned
      x-multica-rate-limit-profiles: [user_default]
      security:
        - memberPAT: []
      servers:
        - url: https://api.multica.ai/api/v1
      responses:
        "200":
          description: Authoritative safe delegation status
          headers:
            ETag:
              description: Opaque content revision, scoped to this delegation
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delegation"
        default:
          $ref: "#/components/responses/Problem"
  /delegations/{delegation_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - name: delegation_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: cancelPublicDelegation
      summary: Explicitly cancel one delegation
      description: >-
        Same default-OFF flag and requester or workspace owner/admin authorization
        as detail reads. Membership and role are rechecked under transaction locks.
        Requires delegations:write. Idempotent without a new idempotency key: repeats
        return the same authoritative task outcome and never create another task.
        The existing cancellation machinery atomically commits cancelled, broadcasts
        a stop to queued/running execution and reconciles scheduling. A confirmed
        cancelled state is authoritative even while runtime process teardown finishes.
        Completion races preserve the terminal winner; terminal outcomes are immutable.
        Optional If-Match compares the current content ETag under the task row lock;
        stale values return revision_conflict without cancellation. On ambiguous
        responses, reconcile by delegation ID before reporting success. No result,
        error text, runtime details or private profile configuration is returned.
      x-multica-contract: shared_resource
      x-multica-scope: delegations:write
      x-multica-workspace-roles: [member, admin, owner]
      x-multica-audit: planned
      x-multica-rate-limit-profiles: [user_default]
      security:
        - memberPAT: []
      servers:
        - url: https://api.multica.ai/api/v1
      parameters:
        - name: If-Match
          in: header
          description: Optional quoted ETag from a prior status read, or star for the existing delegation
          schema: { type: string }
      responses:
        "200":
          description: Authoritative safe delegation status
          headers:
            ETag:
              description: Opaque content revision, scoped to this delegation
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delegation"
        "409":
          description: revision_conflict; reconcile the current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /agents:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    get:
      operationId: listPublicAgents
      summary: List safe agents metadata
      description: >-
        Member PAT only. Current workspace membership and resource visibility
        are required. Hidden, missing and foreign resources return not_found
        on detail reads and are omitted from lists. Runtime details require
        owner/public access with no admin bypass. Profile runtime references
        and coarse availability do not grant runtime access or reserve capacity.
      x-multica-contract: shared_resource
      x-multica-scope: agents:read
      x-multica-workspace-roles: [member, admin, owner]
      x-multica-audit: planned
      x-multica-rate-limit-profiles: [user_default]
      security:
        - memberPAT: []
      servers:
        - url: https://api.multica.ai/api/v1
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          description: Opaque continuation scoped to the actor, workspace, collection and filters; visibility is rechecked on every page
          schema: { type: string, maxLength: 1024 }
        - name: include_archived
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Safe metadata projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentListResponse"
        default:
          $ref: "#/components/responses/Problem"
  /agents/{agent_id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - name: agent_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getPublicAgent
      summary: Get safe agent metadata
      description: >-
        Member PAT only. Current workspace membership and resource visibility
        are required. Hidden, missing and foreign resources return not_found
        on detail reads and are omitted from lists. Runtime details require
        owner/public access with no admin bypass. Profile runtime references
        and coarse availability do not grant runtime access or reserve capacity.
      x-multica-contract: shared_resource
      x-multica-scope: agents:read
      x-multica-workspace-roles: [member, admin, owner]
      x-multica-audit: planned
      x-multica-rate-limit-profiles: [user_default]
      security:
        - memberPAT: []
      servers:
        - url: https://api.multica.ai/api/v1
      responses:
        "200":
          description: Safe metadata projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        default:
          $ref: "#/components/responses/Problem"
  /runtimes:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    get:
      operationId: listPublicRuntimes
      summary: List safe runtimes metadata
      description: >-
        Member PAT only. Current workspace membership and resource visibility
        are required. Hidden, missing and foreign resources return not_found
        on detail reads and are omitted from lists. Runtime details require
        owner/public access with no admin bypass. Profile runtime references
        and coarse availability do not grant runtime access or reserve capacity.
      x-multica-contract: shared_resource
      x-multica-scope: runtimes:read
      x-multica-workspace-roles: [member, admin, owner]
      x-multica-audit: planned
      x-multica-rate-limit-profiles: [user_default]
      security:
        - memberPAT: []
      servers:
        - url: https://api.multica.ai/api/v1
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          description: Opaque continuation scoped to the actor, workspace, collection and filters; visibility is rechecked on every page
          schema: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: Safe metadata projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeListResponse"
        default:
          $ref: "#/components/responses/Problem"
  /runtimes/{runtime_id}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - name: runtime_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getPublicRuntime
      summary: Get safe runtime metadata
      description: >-
        Member PAT only. Current workspace membership and resource visibility
        are required. Hidden, missing and foreign resources return not_found
        on detail reads and are omitted from lists. Runtime details require
        owner/public access with no admin bypass. Profile runtime references
        and coarse availability do not grant runtime access or reserve capacity.
      x-multica-contract: shared_resource
      x-multica-scope: runtimes:read
      x-multica-workspace-roles: [member, admin, owner]
      x-multica-audit: planned
      x-multica-rate-limit-profiles: [user_default]
      security:
        - memberPAT: []
      servers:
        - url: https://api.multica.ai/api/v1
      responses:
        "200":
          description: Safe metadata projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Runtime"
        default:
          $ref: "#/components/responses/Problem"
  /context:
    get:
      operationId: getPluginContext
      summary: Get the authorized Plugin invocation context
      x-multica-contract: plugin_extension
      x-multica-audit: not_required
      x-multica-rate-limit-profiles: [plugin_strict]
      responses:
        "200":
          description: Plugin context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Context"
        default:
          $ref: "#/components/responses/Problem"
  /issues/{issue_ref}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - $ref: "#/components/parameters/IssueRef"
    get:
      operationId: getIssue
      summary: Get an issue
      description: >-
        Use pluginBearer only with the Plugin server and memberPAT only with the
        member server. Member requests must include X-Workspace-ID matching the
        PAT's workspace binding, and current membership is checked on every
        request. Plugin requests derive their workspace from the installation.
      x-multica-contract: shared_resource
      x-multica-scope: issues:read
      x-multica-workspace-roles: [member, admin, owner]
      x-multica-audit: planned
      x-multica-rate-limit-profiles: [user_default, plugin_strict]
      security:
        - pluginBearer: []
        - memberPAT: []
      servers:
        - url: https://plugin-api.multica.ai/v1
          description: Existing Plugin bearer surface
        - url: https://api.multica.ai/api/v1
          description: Scoped member PAT surface
      responses:
        "200":
          description: Issue
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: patchIssue
      summary: Update an issue title or description
      description: >-
        Use pluginBearer only with the Plugin server and memberPAT only with the
        member server. Member requests must include X-Workspace-ID matching the
        PAT's workspace binding, and current membership is checked on every
        request. Plugin requests derive their workspace from the installation.
      x-multica-contract: shared_resource
      x-multica-scope: issues:write
      x-multica-workspace-roles: [member, admin, owner]
      x-multica-audit: planned
      x-multica-rate-limit-profiles: [user_default, plugin_strict]
      security:
        - pluginBearer: []
        - memberPAT: []
      servers:
        - url: https://plugin-api.multica.ai/v1
          description: Existing Plugin bearer surface
        - url: https://api.multica.ai/api/v1
          description: Scoped member PAT surface
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchIssueRequest"
      responses:
        "200":
          description: Updated issue
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        default:
          $ref: "#/components/responses/Problem"
  /issues/{issue_ref}/comments:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
      - $ref: "#/components/parameters/IssueRef"
    get:
      operationId: listIssueComments
      summary: List the newest 200 comments in chronological order
      description: >-
        Use pluginBearer only with the Plugin server and memberPAT only with the
        member server. Member requests must include X-Workspace-ID matching the
        PAT's workspace binding, and current membership is checked on every
        request. Plugin requests derive their workspace from the installation.
      x-multica-contract: shared_resource
      x-multica-scope: comments:read
      x-multica-workspace-roles: [member, admin, owner]
      x-multica-audit: planned
      x-multica-rate-limit-profiles: [user_default, plugin_strict]
      security:
        - pluginBearer: []
        - memberPAT: []
      servers:
        - url: https://plugin-api.multica.ai/v1
          description: Existing Plugin bearer surface
        - url: https://api.multica.ai/api/v1
          description: Scoped member PAT surface
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentListResponse"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createIssueComment
      summary: Create an issue comment without mention dispatch
      description: >-
        Use pluginBearer only with the Plugin server and memberPAT only with the
        member server. Member requests must include X-Workspace-ID matching the
        PAT's workspace binding, and current membership is checked on every
        request. Plugin requests derive their workspace from the installation.
      x-multica-contract: shared_resource
      x-multica-scope: comments:write
      x-multica-workspace-roles: [member, admin, owner]
      x-multica-audit: planned
      x-multica-rate-limit-profiles: [user_default, plugin_strict]
      security:
        - pluginBearer: []
        - memberPAT: []
      servers:
        - url: https://plugin-api.multica.ai/v1
          description: Existing Plugin bearer surface
        - url: https://api.multica.ai/api/v1
          description: Scoped member PAT surface
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        default:
          $ref: "#/components/responses/Problem"
  /storage/{scope}:
    get:
      operationId: listPluginStorageKeys
      summary: List Plugin storage keys
      x-multica-contract: plugin_extension
      x-multica-audit: not_required
      x-multica-rate-limit-profiles: [plugin_strict]
      parameters:
        - $ref: "#/components/parameters/StorageScope"
      responses:
        "200":
          description: Storage keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageKeyListResponse"
        default:
          $ref: "#/components/responses/Problem"
  /storage/{scope}/{key}:
    parameters:
      - $ref: "#/components/parameters/StorageScope"
      - $ref: "#/components/parameters/StorageKey"
    get:
      operationId: getPluginStorageValue
      summary: Get a Plugin storage value
      x-multica-contract: plugin_extension
      x-multica-audit: not_required
      x-multica-rate-limit-profiles: [plugin_strict]
      responses:
        "200":
          description: Storage value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageValueResponse"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: putPluginStorageValue
      summary: Put a Plugin storage value
      x-multica-contract: plugin_extension
      x-multica-audit: planned
      x-multica-rate-limit-profiles: [plugin_strict]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutStorageValueRequest"
      responses:
        "204":
          description: Stored
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deletePluginStorageValue
      summary: Delete a Plugin storage value
      x-multica-contract: plugin_extension
      x-multica-audit: planned
      x-multica-rate-limit-profiles: [plugin_strict]
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    pluginBearer:
      type: http
      scheme: bearer
      bearerFormat: mpi_ or mpc_ token
    memberPAT:
      type: http
      scheme: bearer
      bearerFormat: mul_ scoped member PAT
  parameters:
    WorkspaceID:
      name: X-Workspace-ID
      in: header
      required: false
      description: Required on the member server and must match the scoped PAT binding; ignored by the Plugin server, which derives workspace from installation
      schema:
        type: string
        format: uuid
    IssueRef:
      name: issue_ref
      in: path
      required: true
      description: Issue UUID or workspace identifier such as MUL-123
      schema:
        type: string
    StorageScope:
      name: scope
      in: path
      required: true
      schema:
        type: string
        enum: [user, workspace]
    StorageKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        maxLength: 1024
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Weak or strong ETag containing the expected positive revision
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Reserved for durable retry deduplication as write endpoints adopt it
      schema:
        type: string
        maxLength: 255
  headers:
    ETag:
      description: Weak ETag derived from the resource revision
      schema:
        type: string
  responses:
    Problem:
      description: Stable API problem
      headers:
        X-Request-Id:
          description: Request correlation identifier
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    CreateDelegationRequest:
      type: object
      additionalProperties: false
      required: [agent_id, expected_runtime_id, source, task]
      properties:
        agent_id: { type: string, format: uuid }
        expected_runtime_id: { type: string, format: uuid }
        source:
          type: object
          additionalProperties: false
          required: [system, project_id, task_id]
          properties:
            system: { type: string, minLength: 1, maxLength: 64 }
            project_id: { type: string, minLength: 1, maxLength: 255 }
            task_id: { type: string, minLength: 1, maxLength: 255 }
        task:
          type: object
          additionalProperties: false
          required: [title, instructions]
          properties:
            title: { type: string, minLength: 1, maxLength: 512 }
            instructions: { type: string, minLength: 1, maxLength: 65536 }
    Delegation:
      type: object
      additionalProperties: false
      required: [delegation_id, task_id, workspace_id, agent_id, runtime_id, status, created_at, terminal, revision]
      properties:
        delegation_id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
        runtime_id: { type: string, format: uuid }
        status:
          type: string
          enum: [queued, deferred, dispatched, waiting_local_directory, running, completed, failed, cancelled, unavailable]
        created_at: { type: string, format: date-time }
        terminal:
          type: boolean
          description: True only for completed, failed, cancelled; unavailable does not confirm an outcome
        revision:
          type: string
          description: Opaque status/failure content hash, not a sortable counter
        failure_reason:
          type: string
          description: Stable coarse code; unrecognized internal reasons never escape
          enum: [access_revoked, target_unavailable, timeout, runtime_unavailable, execution_failed, execution_cancelled, execution_unavailable]
    DelegationListResponse:
      type: object
      additionalProperties: false
      required: [delegations]
      properties:
        delegations:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/Delegation" }
        next_cursor: { type: string }
    Agent:
      type: object
      additionalProperties: false
      required: [agent_id, workspace_id, name, runtime_id, runtime_bound, permission_mode, can_invoke, invocation_targets, archived, availability]
      properties:
        agent_id: { type: string, format: uuid }
        workspace_id: { type: string, format: uuid }
        name: { type: string }
        runtime_id:
          type: string
          description: Stable bound runtime reference, including hidden runtimes in this workspace; empty when unbound or the binding cannot be resolved safely
        runtime_bound: { type: boolean }
        permission_mode: { type: string }
        can_invoke:
          type: boolean
          description: Current member permission only, false for archived profiles; does not guarantee readiness or admission
        invocation_targets:
          type: array
          items: { $ref: "#/components/schemas/InvocationTarget" }
        archived: { type: boolean }
        availability:
